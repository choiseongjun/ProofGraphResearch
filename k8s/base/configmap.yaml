apiVersion: v1
kind: ConfigMap
metadata:
  name: research-config
data:
  LLM_PROVIDER: ollama
  OLLAMA_BASE_URL: http://host.k3d.internal:11434
  OLLAMA_MODEL: hoangquan456/qwen3-nothink:4b
  OLLAMA_TIMEOUT_SECONDS: "600"
  REDIS_URL: redis://redis:6379/0
  MAX_REVISIONS: "2"
