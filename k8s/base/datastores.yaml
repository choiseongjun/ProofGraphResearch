apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: research}
            - {name: POSTGRES_USER, value: research}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: research-secrets, key: POSTGRES_PASSWORD}}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U research -d research"]}
            initialDelaySeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, initialDelaySeconds: 3}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: neo4j}
spec:
  serviceName: neo4j
  replicas: 1
  selector: {matchLabels: {app: neo4j}}
  template:
    metadata: {labels: {app: neo4j}}
    spec:
      # Prevent NEO4J_PORT_* service-link variables from being interpreted as Neo4j settings.
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports: [{containerPort: 7474}, {containerPort: 7687}]
          env:
            - name: NEO4J_AUTH
              valueFrom: {secretKeyRef: {name: research-secrets, key: NEO4J_AUTH}}
            - {name: NEO4J_server_memory_pagecache_size, value: 256M}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: neo4j}
spec:
  selector: {app: neo4j}
  ports:
    - {name: http, port: 7474, targetPort: 7474}
    - {name: bolt, port: 7687, targetPort: 7687}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: qdrant}
spec:
  serviceName: qdrant
  replicas: 1
  selector: {matchLabels: {app: qdrant}}
  template:
    metadata: {labels: {app: qdrant}}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.18.0
          ports: [{containerPort: 6333}]
          readinessProbe: {httpGet: {path: /readyz, port: 6333}, initialDelaySeconds: 5}
          volumeMounts: [{name: data, mountPath: /qdrant/storage}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: qdrant}
spec:
  selector: {app: qdrant}
  ports: [{name: http, port: 6333, targetPort: 6333}]
