apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: proofgraph-api
        metrics_path: /metrics
        static_configs: [{targets: ["api:8000"]}]
      - job_name: redis
        static_configs: [{targets: ["redis-exporter:9121"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-exporter}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis-exporter}}
  template:
    metadata: {labels: {app: redis-exporter}}
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.66.0
          env: [{name: REDIS_ADDR, value: redis://redis:6379}]
          ports: [{containerPort: 9121}]
---
apiVersion: v1
kind: Service
metadata: {name: redis-exporter}
spec:
  selector: {app: redis-exporter}
  ports: [{port: 9121, targetPort: 9121}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.2.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: ProofGraph
        folder: ProofGraph
        type: file
        options: {path: /var/lib/grafana/dashboards}
  proofgraph-overview.json: |
    {"title":"ProofGraph 운영 대시보드","uid":"proofgraph-overview","schemaVersion":39,"panels":[{"type":"stat","title":"RAG 청크 수","targets":[{"expr":"proofgraph_knowledge_chunks","refId":"A"}],"gridPos":{"h":6,"w":6,"x":0,"y":0}},{"type":"stat","title":"대기 수집 작업","targets":[{"expr":"proofgraph_ingestion_jobs{status=\"queued\"}","refId":"A"}],"gridPos":{"h":6,"w":6,"x":6,"y":0}},{"type":"stat","title":"진행 중 수집 작업","targets":[{"expr":"proofgraph_ingestion_jobs{status=\"running\"}","refId":"A"}],"gridPos":{"h":6,"w":6,"x":12,"y":0}},{"type":"stat","title":"완료된 수집 작업","targets":[{"expr":"proofgraph_ingestion_jobs{status=\"completed\"}","refId":"A"}],"gridPos":{"h":6,"w":6,"x":18,"y":0}},{"type":"timeseries","title":"API 요청률","targets":[{"expr":"sum(rate(proofgraph_http_requests_total[5m])) by (path)","legendFormat":"{{path}}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":0,"y":6}},{"type":"timeseries","title":"API p95 응답 시간","targets":[{"expr":"histogram_quantile(0.95, sum(rate(proofgraph_http_request_duration_seconds_bucket[5m])) by (le, path))","legendFormat":"{{path}}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":12,"y":6}},{"type":"timeseries","title":"Celery 큐 적체","targets":[{"expr":"proofgraph_celery_queue_messages","legendFormat":"{{queue}}","refId":"A"}],"gridPos":{"h":8,"w":12,"x":0,"y":14}},{"type":"timeseries","title":"Redis 메모리","targets":[{"expr":"redis_memory_used_bytes","legendFormat":"used bytes","refId":"A"}],"gridPos":{"h":8,"w":12,"x":12,"y":14}},{"type":"timeseries","title":"작업 상태 변화","targets":[{"expr":"proofgraph_ingestion_jobs","legendFormat":"수집 {{status}}","refId":"A"},{"expr":"proofgraph_research_jobs","legendFormat":"리서치 {{status}}","refId":"B"}],"gridPos":{"h":8,"w":24,"x":0,"y":22}}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.1
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: provisioning, mountPath: /var/lib/grafana/dashboards/proofgraph-overview.json, subPath: proofgraph-overview.json}
      volumes:
        - {name: provisioning, configMap: {name: grafana-provisioning}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
